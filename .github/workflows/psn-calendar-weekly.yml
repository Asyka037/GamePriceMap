name: Weekly PlayStation US release calendar

on:
  schedule:
    # Keep the 51-page calendar sweep away from Thursday's PSN price fleet.
    - cron: '0 13 * * 2'   # Tuesdays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  psn-calendar-weekly:
    # Explicit accident guard for the user-authorized PlayStation automation.
    if: ${{ vars.PSN_AUTOMATION_AUTHORIZED == 'true' }}
    runs-on: ubuntu-latest
    # A 60-slot lease can spend up to 45 minutes on bounded transport timeouts;
    # leave room for tests, validation and the final data commit.
    timeout-minutes: 65
    env:
      PSN_AUTOMATION_AUTHORIZED: ${{ vars.PSN_AUTOMATION_AUTHORIZED }}
      PSN_US_RUN_LEASE_PATH: /tmp/psn-us-calendar-${{ github.run_id }}-${{ github.run_attempt }}.json
      PSN_US_RUN_LEASE_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}:psn-calendar-weekly
      PSN_US_RUN_LEASE_PURPOSE: calendar
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Refresh before tests and allocation. If main moves after this point, the
      # lease push fails and the scraper must never start.
      - name: Pull latest PSN budget head
        run: git pull --ff-only origin main

      - name: Install root tooling dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Reserve full PSN calendar run budget
        run: node scripts/reserve-psn-run-budget.mjs --purpose=calendar

      - name: Commit and push PSN calendar run budget
        run: |
          git config user.name "gamepricemap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seeds/psn-us-request-budget.json
          if git diff --cached --quiet; then
            echo "PSN calendar lease did not reserve tracked capacity." >&2
            exit 1
          fi
          git commit -m "chore(data): reserve PSN calendar run $(date -u +%F)"
          git push origin HEAD:main

      - name: Scrape PlayStation Store US release calendar
        run: npm run scrape:psn-calendar

      - name: Merge console release caches into public calendar
        run: npm run merge:console-calendar

      - name: Validate data gate
        run: npm run validate

      - name: Commit and push PlayStation release data
        run: |
          git config user.name "gamepricemap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds/calendar.json data/source-health.json data/health.json
          if [ -f data/feeds/releases-psn.json ]; then
            git add data/feeds/releases-psn.json
          fi
          if git diff --cached --quiet; then
            echo "No PlayStation release changes."
            exit 0
          fi
          git commit -m "chore(data): weekly PlayStation release refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
