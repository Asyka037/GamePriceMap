name: Weekly PlayStation US POC

on:
  schedule:
    # PSN stays out of Monday's Xbox/offers fleet and the 07:30 UTC daily run.
    # Separate scheduling keeps either weekly fleet below the 30-minute budget.
    - cron: '0 13 * * 4'   # Thursdays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  psn-weekly:
    # The user accepted PlayStation automation risk on 2026-07-18. Keep the
    # repository variable as an explicit accident guard for this approved job.
    if: ${{ vars.PSN_AUTOMATION_AUTHORIZED == 'true' }}
    runs-on: ubuntu-latest
    # A 60-slot lease can spend up to 45 minutes on bounded transport timeouts;
    # leave room for tests, history evolution and the final data commit.
    timeout-minutes: 65
    env:
      PSN_AUTOMATION_AUTHORIZED: ${{ vars.PSN_AUTOMATION_AUTHORIZED }}
      PSN_US_RUN_LEASE_PATH: /tmp/psn-us-price-${{ github.run_id }}-${{ github.run_attempt }}.json
      PSN_US_RUN_LEASE_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}:psn-weekly
      PSN_US_RUN_LEASE_PURPOSE: price
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pull latest PSN budget head
        run: git pull --ff-only origin main

      - name: Check for verified PSN mappings
        id: scope
        run: node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('data/catalog.json','utf8')); console.log('enabled='+c.games.some(g=>g.psnProductId));" >> "$GITHUB_OUTPUT"

      - name: Install root tooling dependencies
        if: steps.scope.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        if: steps.scope.outputs.enabled == 'true'
        run: npm test

      - name: Reserve full PSN price run budget
        if: steps.scope.outputs.enabled == 'true'
        run: node scripts/reserve-psn-run-budget.mjs --purpose=price

      - name: Commit and push PSN price run budget
        if: steps.scope.outputs.enabled == 'true'
        run: |
          git config user.name "gamepricemap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seeds/psn-us-request-budget.json
          if git diff --cached --quiet; then
            echo "PSN price lease did not reserve tracked capacity." >&2
            exit 1
          fi
          git commit -m "chore(data): reserve PSN price run $(date -u +%F)"
          git push origin HEAD:main

      - name: Scrape PlayStation Store US POC (verified standard products only)
        if: steps.scope.outputs.enabled == 'true'
        run: node scripts/scrape-psn.mjs

      - name: Evolve price history (includes PlayStation US)
        if: steps.scope.outputs.enabled == 'true'
        run: npm run history:observations

      - name: Validate data gate
        if: steps.scope.outputs.enabled == 'true'
        run: npm run validate

      - name: Commit and push PSN observations
        if: steps.scope.outputs.enabled == 'true'
        run: |
          git config user.name "gamepricemap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/psn/ data/history/ data/source-health.json data/health.json
          if git diff --cached --quiet; then
            echo "No PlayStation price changes."
            exit 0
          fi
          git commit -m "chore(data): weekly PSN refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
