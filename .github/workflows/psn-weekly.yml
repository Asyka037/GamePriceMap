name: Weekly PlayStation US POC

on:
  schedule:
    # PSN stays out of Monday's Xbox/offers fleet and the 07:30 UTC daily run.
    # Separate scheduling keeps either weekly fleet below the 30-minute budget.
    - cron: '0 13 * * 4'   # Thursdays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  psn-weekly:
    # The user accepted PlayStation automation risk on 2026-07-18. Keep the
    # repository variable as an explicit accident guard for this approved job.
    if: ${{ vars.PSN_AUTOMATION_AUTHORIZED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSN_AUTOMATION_AUTHORIZED: ${{ vars.PSN_AUTOMATION_AUTHORIZED }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for verified PSN mappings
        id: scope
        run: node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('data/catalog.json','utf8')); console.log('enabled='+c.games.some(g=>g.psnProductId));" >> "$GITHUB_OUTPUT"

      - name: Install root tooling dependencies
        if: steps.scope.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        if: steps.scope.outputs.enabled == 'true'
        run: npm test

      - name: Scrape PlayStation Store US POC (verified standard products only)
        if: steps.scope.outputs.enabled == 'true'
        run: node scripts/scrape-psn.mjs

      # Persist consumed slots before downstream gates. A history/validate
      # failure must not let a same-day rerun start from the old allowance.
      - name: Checkpoint PSN request budget
        if: ${{ always() && steps.scope.outputs.enabled == 'true' }}
        run: |
          if git diff --quiet -- data/seeds/psn-us-request-budget.json; then
            exit 0
          fi
          git config user.name "gamepricemap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seeds/psn-us-request-budget.json
          git commit -m "chore(data): reserve PSN request budget $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Evolve price history (includes PlayStation US)
        if: steps.scope.outputs.enabled == 'true'
        run: npm run history:observations

      - name: Validate data gate
        if: steps.scope.outputs.enabled == 'true'
        run: npm run validate

      - name: Commit and push PSN observations
        if: steps.scope.outputs.enabled == 'true'
        run: |
          git config user.name "gamepricemap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/psn/ data/history/ data/seeds/psn-us-request-budget.json data/source-health.json data/health.json
          if git diff --cached --quiet; then
            echo "No PlayStation price changes."
            exit 0
          fi
          git commit -m "chore(data): weekly PSN refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
